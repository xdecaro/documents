name: Documents CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find component plugins package tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: XML release metadata and integration boundaries
        run: python3 build/validate.py
      - name: Smoke
        run: php tests/smoke.php
      - name: Deterministic build A
        run: python3 build/build.py && cp dist/SHA256SUMS.txt /tmp/documents-a.txt
      - name: Package validation
        run: python3 build/validate.py --dist
      - name: Deterministic build B
        run: python3 build/build.py && diff -u /tmp/documents-a.txt dist/SHA256SUMS.txt

  joomla-runtime:
    name: Joomla 6.1.3 / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        mode: ['clean', 'upgrade-1.3.0', 'missing-core']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: joomla
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, simplexml
          coverage: none
      - name: Build Documents package
        run: python3 build/build.py
      - name: Download verified dependencies
        shell: bash
        run: |
          set -euo pipefail
          JOOMLA='6.1.3'
          JSHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1'
          JFILE="Joomla_${JOOMLA}-Stable-Full_Package.zip"
          curl -fL --retry 3 "https://github.com/joomla/joomla-cms/releases/download/${JOOMLA}/${JFILE}" -o /tmp/joomla.zip
          echo "${JSHA}  /tmp/joomla.zip" | sha256sum --check --strict

          curl -fL --retry 3 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' -o /tmp/core.zip
          echo '4248f7e3de514c2ae2402ffc8ba12845647dca1ebac963da370650e88ac45def  /tmp/core.zip' | sha256sum --check --strict

          if [ '${{ matrix.mode }}' = 'upgrade-1.3.0' ]; then
            curl -fL --retry 3 'https://github.com/xdecaro/documents/releases/download/v1.3.0/pkg_decarodocuments_1.3.0.zip' -o /tmp/documents-old.zip
            echo '585cfb06fa3784ca0944e0ca9cd0aea7f1dd46816b3f98a812448a5704bbb75f  /tmp/documents-old.zip' | sha256sum --check --strict
          fi

          mkdir joomla && unzip -q /tmp/joomla.zip -d joomla
      - name: Install Joomla
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install --site-name='Documents CI' --admin-user='Documents CI Admin' --admin-username=admin --admin-password="DocsCI-${GITHUB_RUN_ID}!" --admin-email=admin@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=joomla --db-prefix=doc_ --db-encryption=0 --no-interaction
      - name: Install Core when required
        if: matrix.mode != 'missing-core'
        run: cd joomla && php cli/joomla.php extension:install --path=/tmp/core.zip -vvv
      - name: Verify mandatory Core rejection
        if: matrix.mode == 'missing-core'
        run: |
          set -euo pipefail
          cd joomla
          VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          set +e
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_decarodocuments_${VERSION}.zip" -vvv >/tmp/documents-without-core.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/documents-without-core.log
          test "$STATUS" -ne 0
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM doc_extensions WHERE type='package' AND element='pkg_decarodocuments';")" = '0'
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM doc_extensions WHERE type='component' AND element='com_decarodocuments';")" = '0'
          test ! -d administrator/components/com_decarodocuments
          test ! -e administrator/manifests/packages/decarodocuments.xml
      - name: Install 1.3.0 upgrade baseline
        if: matrix.mode == 'upgrade-1.3.0'
        run: |
          set -euo pipefail
          cd joomla
          php cli/joomla.php extension:install --path=/tmp/documents-old.zip -vvv
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot joomla)
          "${MYSQL[@]}" -e "INSERT INTO doc_decarodocuments_documents (uuid,title,description,original_name,stored_name,mime_type,file_size,sha256,state,access,created,created_by,modified,modified_by) VALUES ('11111111-1111-4111-8111-111111111111','Migration seed','Preserve me','seed.pdf','11111111-1111-4111-8111-111111111111.blob','application/pdf',123,REPEAT('0',64),1,2,NOW(),1,NULL,0);"
      - name: Install Documents 1.4.0
        if: matrix.mode != 'missing-core'
        run: |
          set -euo pipefail
          cd joomla
          VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_decarodocuments_${VERSION}.zip" -vvv
      - name: Verify Documents schema, migration and optional adapter
        if: matrix.mode != 'missing-core'
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)

          for table in doc_decarodocuments_documents doc_decarodocuments_relations doc_decarodocuments_versions doc_decarodocuments_audit; do
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='${table}';")" = '1'
          done

          for column in document_type lifecycle_status confidentiality reference_code document_date valid_from expires_at language current_version; do
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='doc_decarodocuments_documents' AND column_name='${column}';")" = '1'
          done

          schema="$("${MYSQL[@]}" -e "SELECT s.version_id FROM doc_schemas s JOIN doc_extensions e ON e.extension_id=s.extension_id WHERE e.type='component' AND e.element='com_decarodocuments' LIMIT 1;")"
          test "$schema" = "$VERSION"

          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM doc_extensions WHERE type='plugin' AND folder='xdecaroanalytics' AND element='decarodocuments';")" = '1'

          if [ '${{ matrix.mode }}' = 'clean' ]; then
            test "$("${MYSQL[@]}" -e "SELECT enabled FROM doc_extensions WHERE type='plugin' AND folder='xdecaroanalytics' AND element='decarodocuments' LIMIT 1;")" = '1'
          fi

          if [ '${{ matrix.mode }}' = 'upgrade-1.3.0' ]; then
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM doc_decarodocuments_documents WHERE uuid='11111111-1111-4111-8111-111111111111' AND title='Migration seed';")" = '1'
            test "$("${MYSQL[@]}" -e "SELECT lifecycle_status FROM doc_decarodocuments_documents WHERE uuid='11111111-1111-4111-8111-111111111111';")" = 'published'
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM doc_decarodocuments_versions v JOIN doc_decarodocuments_documents d ON d.id=v.document_id WHERE d.uuid='11111111-1111-4111-8111-111111111111' AND v.version_number=1 AND v.is_current=1;")" = '1'
          fi

name: Documents Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists. Bump VERSION before publishing different files."
            exit 1
          fi
      - name: PHP syntax
        run: find component package tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate source
        run: python3 build/validate.py && php tests/smoke.php
      - name: Build
        run: python3 build/build.py
      - name: Validate package
        run: python3 build/validate.py --dist
      - name: Synchronize update checksum
        run: python3 build/update_feed_checksum.py
      - name: Verify checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="$(sha256sum "dist/pkg_decarodocuments_${VERSION}.zip" | awk '{print $1}')"
          grep -q "<sha256>${SHA}</sha256>" updates/pkg_decarodocuments.xml
          grep -q "${SHA}  pkg_decarodocuments_${VERSION}.zip" dist/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "dist/com_decarodocuments_${VERSION}.zip" \
            "dist/pkg_decarodocuments_${VERSION}.zip" \
            "dist/SHA256SUMS.txt" \
            --title "Documents by xdecaro ${VERSION}" \
            --notes "Documents by xdecaro ${VERSION}: canonical Core 1.3 namespace integration with stable Joomla identities and unchanged document schema."
      - name: Publish update-feed checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_decarodocuments.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish SHA-256 for Documents ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
